version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moodi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moodi_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodi_network

  redis:
    image: redis:7-alpine
    container_name: moodi_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodi_network

  adminer:
    image: adminer
    container_name: moodi_adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - moodi_network

volumes:
  postgres_data:
  redis_data:

networks:
  moodi_network:
    driver: bridge
